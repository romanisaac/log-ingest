[workspace]
members = [
    "crates/event-schema",
    "crates/batch-buffer",
    "crates/manifest",
    "crates/storage",
    "crates/query-engine",
    "crates/compactor",
    "server",
    "seed",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
